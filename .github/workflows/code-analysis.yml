name: Code analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  environments:
    name: Environment lock (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [".", "transportability", "transportability/geneformer_env"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          python-version: "3.11"

      - name: Check manifest and lock agreement
        run: uv --no-config sync --project "${{ matrix.project }}" --locked --dry-run

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transportability
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv --no-config sync --locked --only-group dev

      - name: Ruff lint
        run: uv --no-config run --locked --only-group dev ruff check .

      - name: Ruff format check
        run: uv --no-config run --locked --only-group dev ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transportability
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv --no-config sync --locked

      - name: Check core runtime imports
        run: >-
          uv --no-config run --locked python -c
          "import scanpy, scvi, torch, transformers;
          from scvi.dataloaders import CollectionAdapter"

      - name: Pytest
        run: uv --no-config run --locked pytest -q

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    if: false # re-enable once GHAS is available on this repo
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
