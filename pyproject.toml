[project]
name = "mechanisms-matter"
version = "0.1.0"
description = "Notebook environment for Mechanisms Matter experiments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "perturbations",
    "fastcluster>=1.2.6",
    "ipdb>=0.13.13",
    "ipython>=5.2.0",
    "nbconvert>=7.16.6",
    "scienceplots>=2.1.1",
    "ipykernel (>=6.29.5,<7.0.0)",
    "cell-gears (>=0.1.2,<0.2.0)",
    "jupytext>=1.17.1,!=1.20.0",
    "arc-state>=0.10.2",
]

[tool.uv]
package = false

[tool.uv.sources]
perturbations = { path = "transportability", editable = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
